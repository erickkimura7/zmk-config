; Diagnostico de pinos do nice!nano (clone) usado no Corne.
; Build:  pio run   ->  depois converter .bin em .uf2 (ver README do zmk-config)
[env:nicenano]
platform = nordicnrf52
board = nrf52840_dk_adafruit
framework = arduino
monitor_speed = 115200
platform_packages =
    platformio/toolchain-gccarmnoneeabi@1.140201.0
build_flags =
    -DUSE_TINYUSB
