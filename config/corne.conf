# Clones "Pro Micro nRF52840" costumam vir SEM o cristal de 32.768 kHz do
# nice!nano original. Sem ele, o BLE anuncia mas toda conexão cai na hora
# (le-connection-abort-by-local), inclusive entre as metades. Usa o
# oscilador RC interno do nRF52840 no lugar do cristal.
# Com RC as conexões abriam mas caíam por supervision timeout (reason 0x08).
# SYNTH gera os 32 kHz a partir do cristal HF de 32 MHz: conexões estáveis
# (confirmado por log USB em 2026-11-24). Gasta um pouco mais de bateria.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_SYNTH=y

# Conexão BLE caía durante a autenticação (AuthenticationTimeout) no Pi e no
# Windows. Liga as mudanças "experimentais" do ZMK: desativa o 2M PHY
# (EXPERIMENTAL_CONN) e permite re-pareamento por cima de bond antigo
# (EXPERIMENTAL_SEC).
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
# ...mas EXPERIMENTAL_SEC liga (via imply) a exigência de digitar um PIN de
# 6 dígitos + Enter no teclado, impossível só com a metade esquerda.
# Desliga o PIN: pareamento "Just Works".
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n

# Bateria: reporta nível das duas metades ao host
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Economia de energia: deep sleep após 15 min parado
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Descomente se tiver OLED no Corne
# CONFIG_ZMK_DISPLAY=y
