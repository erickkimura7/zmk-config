# Clones "Pro Micro nRF52840" costumam vir SEM o cristal de 32.768 kHz do
# nice!nano original. Sem ele, o BLE anuncia mas toda conexão cai na hora
# (le-connection-abort-by-local), inclusive entre as metades. Usa o
# oscilador RC interno do nRF52840 no lugar do cristal.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# Bateria: reporta nível das duas metades ao host
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Economia de energia: deep sleep após 15 min parado
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Descomente se tiver OLED no Corne
# CONFIG_ZMK_DISPLAY=y
