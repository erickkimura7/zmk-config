# Matriz de build do GitHub Actions — gera um .uf2 por linha
---
include:
  - board: nice_nano_v2
    shield: corne_left
  - board: nice_nano_v2
    shield: corne_right
  # Firmware para limpar o pareamento BLE entre as metades (use se der problema)
  - board: nice_nano_v2
    shield: settings_reset
  # Diagnostico: esquerda com log pela USB (serial /dev/ttyACM0). Nao usar no dia a dia.
  - board: nice_nano_v2
    shield: corne_left
    snippet: zmk-usb-logging
    artifact-name: corne_left_logging
  # Diagnostico: direita com log pela USB. Nao usar no dia a dia.
  - board: nice_nano_v2
    shield: corne_right
    snippet: zmk-usb-logging
    artifact-name: corne_right_logging
