# Matriz de build do GitHub Actions — gera um .uf2 por linha
---
include:
  # Firmwares de uso
  - board: nice_nano_v2
    shield: corne_left
  - board: nice_nano_v2
    shield: corne_right
  # Limpa o pareamento BLE (use se as metades nao se conectarem)
  - board: nice_nano_v2
    shield: settings_reset
  # Diagnostico: mesmo firmware, mas com log pela USB (/dev/ttyACM0)
  - board: nice_nano_v2
    shield: corne_left
    snippet: zmk-usb-logging
    artifact-name: corne_left_logging
  - board: nice_nano_v2
    shield: corne_right
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_ZMK_RESET_REASON_LOG=y
    artifact-name: corne_right_logging
